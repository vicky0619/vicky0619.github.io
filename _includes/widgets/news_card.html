{% assign news_by_year = site.news | sort: "date" | reverse | slice: 0, include.limit | group_by_exp: "item", "item.date | date: '%Y'" -%}

<div class="card border-0 shadow-sm bg-white mb-3">
    <div class="card-body p-4">
        <h6 class="entry-section-title mb-3"><i class="fas fa-rss"></i> News</h6>

        <div class="news-timeline">
            {% for year in news_by_year %}
            <div class="news-year">{{ year.name }}</div>
            {% for item in year.items %}
            <div class="news-item">
                <div class="news-date">{{ item.date | date: "%b %d" }}</div>
                <div class="news-text">{{ item.title }}</div>
            </div>
            {% endfor %}
            {% endfor %}
        </div>
    </div>
</div>
