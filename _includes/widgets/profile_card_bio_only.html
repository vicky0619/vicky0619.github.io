<div class="mt-3 d-md-none"></div>
<div class="row">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col h3">
                        About Me
                    </div>
                </div>
                <div class="row p-3">
                    <div class="col">
                        <div class="text-profile-bio mt-0" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                            {{ site.data.profile.short_bio }}
                        </div>

                        <div class="mt-3">
                            <a class="btn btn-sm btn-outline-dark mr-2 mb-2" href="{{ '/experience' | relative_url }}">
                                <i class="fas fa-briefcase"></i> Experience &amp; Projects
                            </a>
                            {% if site.data.profile.cv_link %}
                            <a class="btn btn-sm btn-outline-dark mr-2 mb-2" target="_blank" href="{{ site.data.profile.cv_link | relative_url }}">
                                <i class="fas fa-file-alt"></i> Resume (PDF)
                            </a>
                            {% endif %}
                            {% if site.data.profile.github %}
                            <a class="btn btn-sm btn-outline-dark mr-2 mb-2" target="_blank" href="https://github.com/{{ site.data.profile.github }}">
                                <i class="fab fa-github"></i> GitHub
                            </a>
                            {% endif %}
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
