short_bio: >-
  <p>
    I am a master's student in <strong>Intelligent Information Systems</strong> at Carnegie Mellon University's
    <a href="https://lti.cs.cmu.edu/" target="_blank">Language Technologies Institute</a>, graduating in
    <strong>December 2027</strong>. Before CMU I earned my B.S. in Computer Science and Information Engineering
    from National Central University, Taiwan.
  </p>
  <p>
    I build <strong>AI developer tools and workflow automation</strong>, on top of an applied-AI, mobile, and
    algorithms/systems foundation. Recently that has meant a TypeScript end-to-end test suite and an MCP-based
    issue-triage agent at <strong>ASUS</strong>, a geometric conflict engine and classical-CV pipeline for AR room
    scans at <strong>RoomMuse</strong>, and quantization-aware distillation of edge LLMs at NCU's
    <strong>Wireless Ad-Hoc and Sensor Networks Lab</strong>.
  </p>
  <p>
    <strong>I am looking for Summer 2027 software engineering internships</strong> in developer tooling,
    infrastructure and automation, and applied AI.
  </p>

